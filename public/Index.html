<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alucard AI Image Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e1e1e; padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; }
    h1 { margin-bottom: 16px; font-size: 1.5rem; color: #2196f3; }
    textarea { width: 100%; height: 100px; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 1rem; resize: none; margin-bottom: 16px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #007bff; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; }
    .result { margin-top: 20px; }
    img { width: 100%; max-width: 100%; border-radius: 8px; margin-top: 12px; display: none; }
    .error { color: #ff4d4d; margin-top: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>Alucard AI Image Generator</h1>
  <textarea id="promptInput" placeholder="Describe the image you want to generate..."></textarea>
  <button id="generateBtn" onclick="generateImage()">Generate Image</button>
  
  <div class="result">
    <p id="status"></p>
    <img id="outputImage" alt="Generated Output">
    <p id="errorText" class="error"></p>
  </div>
</div>

<script>
  async function generateImage() {
    const promptInput = document.getElementById('promptInput');
    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const img = document.getElementById('outputImage');
    const errorText = document.getElementById('errorText');

    const prompt = promptInput.value.trim();
    if (!prompt) {
      errorText.innerText = "Please enter a prompt.";
      return;
    }

    errorText.innerText = "";
    status.innerText = "Generating image... Please wait.";
    img.style.display = "none";
    btn.disabled = true;

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Failed to generate image');
      }

      img.src = data.imageUrl;
      img.style.display = "block";
      status.innerText = "Done!";
    } catch (err) {
      status.innerText = "";
      errorText.innerText = err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
